const walkthrough={"Kanto": [{"title": "Pallet to Pewter", "steps": ["Choose a starter in Oak’s lab and battle your rival; head north on Route 1.", "Reach Viridian City and collect Oak’s parcel from the Poké Mart.", "Return to Oak’s lab; obtain the Pokédex and return to Viridian.", "Travel through Route 2 and Viridian Forest to Pewter City.", "Defeat Brock at Pewter Gym."]}, {"title": "Pewter to Cerulean", "steps": ["Follow Route 3 east to Mt. Moon.", "Cross Mt. Moon, battle the Rocket members and choose a fossil.", "Exit on Route 4 and reach Cerulean City.", "Defeat Misty at Cerulean Gym.", "Cross Nugget Bridge, battle your rival and travel along Routes 24 and 25.", "Help Bill at his cottage to receive the S.S. Ticket.", "Return to Cerulean and pass through the burglarized house; head south."]}, {"title": "Vermilion and Rock Tunnel", "steps": ["Take the underground passage from Route 5 to Route 6; enter Vermilion.", "Board the S.S. Anne using the ticket.", "Find the captain after battling your rival; obtain Cut.", "Use Cut to enter Vermilion Gym and defeat Lt. Surge.", "Visit Diglett’s Cave and Route 2 if you need the Flash field move.", "Return toward Cerulean, follow Routes 9 and 10 and cross Rock Tunnel.", "Reach Lavender Town; the Pokémon Tower story continues after obtaining the Silph Scope."]}, {"title": "Celadon and Lavender", "steps": ["Follow Route 8 west and the underground passage to Route 7 and Celadon.", "Enter the Game Corner Rocket Hideout via its hidden switch.", "Find the Lift Key, defeat Giovanni and obtain the Silph Scope.", "Defeat Erika at Celadon Gym.", "Obtain the drink or tea required by the Saffron guards in the local storyline.", "Return to Lavender and climb Pokémon Tower.", "Resolve the ghost encounter, defeat Rocket members and rescue Mr. Fuji.", "Receive the Poké Flute from Mr. Fuji."]}, {"title": "Fuchsia and Saffron", "steps": ["Wake a sleeping Snorlax with the Poké Flute to open a route south.", "Reach Fuchsia via Cycling Road or Routes 12–15.", "Explore the Safari Zone to obtain the Gold Teeth and Surf.", "Return the Gold Teeth to the warden for Strength.", "Defeat Koga in Fuchsia Gym.", "Enter Saffron and clear Silph Co.; obtain the Card Key to open locked doors.", "Battle your rival and defeat Giovanni; speak to the president.", "Defeat Sabrina at Saffron Gym."]}, {"title": "Cinnabar and League", "steps": ["Reach Cinnabar by Surf from Pallet or by the southern sea routes.", "Explore Pokémon Mansion and obtain the Secret Key.", "Unlock Cinnabar Gym and defeat Blaine.", "Return to Viridian and defeat Giovanni in the final gym.", "Head west on Route 22 and pass the badge gates on Route 23.", "Cross Victory Road using the required field moves.", "Defeat the Elite Four and Champion at Indigo Plateau."]}, {"title": "After the League", "steps": ["Follow the available Sevii Islands quests and check the full guide for island access requirements.", "Return to optional caves, routes and item locations; verify remaining postgame objectives with the linked guide."]}], "Johto": [{"title": "New Bark to Violet", "steps": ["Choose a starter from Professor Elm and travel west to Cherrygrove.", "Follow Routes 30 and 31 toward Mr. Pokémon’s house.", "Return toward Elm after the emergency call; battle your rival on the way.", "Report to Elm and start the Pokédex journey.", "Reach Violet City via Route 31.", "Complete Sprout Tower and defeat Falkner in Violet Gym.", "Collect the egg if offered by Elm’s aide."]}, {"title": "Azalea and Goldenrod", "steps": ["Travel south on Route 32 and cross Union Cave to Route 33.", "Reach Azalea and speak with Kurt.", "Enter Slowpoke Well and defeat Team Rocket.", "Defeat Bugsy at Azalea Gym.", "Battle your rival and cross Ilex Forest.", "Return the missing Farfetch’d and obtain Cut.", "Travel north on Route 34 to Goldenrod.", "Visit the Radio Tower and obtain the radio card if available.", "Defeat Whitney; return to collect the badge if needed.", "Obtain the SquirtBottle from the flower shop."]}, {"title": "Ecruteak and Olivine", "steps": ["Travel Routes 35 and 36 via National Park; use the SquirtBottle to clear Sudowoodo.", "Reach Ecruteak via Route 37.", "Explore Burned Tower and resolve the rival and roaming Pokémon events.", "Complete the local dance theater event and obtain Surf when available.", "Defeat Morty in Ecruteak Gym.", "Follow Routes 38 and 39 to Olivine.", "Climb the lighthouse and speak with Jasmine about Amphy.", "Surf Routes 40 and 41 to Cianwood.", "Obtain the medicine from Cianwood Pharmacy.", "Defeat Chuck; obtain Fly from the relevant NPC.", "Return to Olivine Lighthouse and deliver the medicine.", "Defeat Jasmine in Olivine Gym."]}, {"title": "Mahogany and Radio Tower", "steps": ["Return through Ecruteak and follow Route 42 to Mahogany.", "Head north on Route 43 to Lake of Rage and resolve the Red Gyarados event.", "Speak with Lance and enter the hidden Rocket base in Mahogany.", "Find the passwords, clear the base and stop its signal.", "Defeat Pryce in Mahogany Gym.", "Return to Goldenrod after the Rocket radio takeover.", "Clear the Radio Tower, then visit the Underground to rescue the director.", "Obtain the Card Key and finish the Radio Tower takeover."]}, {"title": "Blackthorn and League", "steps": ["Travel east from Mahogany along Route 44 and through Ice Path.", "Obtain Waterfall in Ice Path if not already acquired.", "Reach Blackthorn and defeat Clair.", "Complete the Dragon’s Den trial to obtain the final badge.", "Return to New Bark and follow the story’s remaining required events before the League.", "Surf east via Route 27 and cross Tohjo Falls and Route 26.", "Pass the badge gates and cross Victory Road.", "Defeat the Elite Four and Champion at Indigo Plateau."]}, {"title": "After the League", "steps": ["Check the linked guide for PokeMMO-specific Johto postgame access and optional areas; do not assume HeartGold’s original Kanto campaign is identical."]}], "Hoenn": [{"title": "Littleroot to Rustboro", "steps": ["Set up your room, meet your neighbor and find Professor Birch on Route 101.", "Choose a starter to rescue Birch.", "Reach Oldale and meet your rival on Route 103.", "Return to Birch for the Pokédex and begin the journey.", "Travel Route 102 to Petalburg; meet Norman and help Wally.", "Follow Route 104 and cross Petalburg Woods; help the Devon worker.", "Reach Rustboro and defeat Roxanne.", "Pursue the stolen Devon goods on Route 116 and rescue Peeko in Rusturf Tunnel.", "Return the goods and receive the delivery instructions from Devon."]}, {"title": "Dewford to Mauville", "steps": ["Return to Route 104 and take Mr. Briney’s boat to Dewford.", "Defeat Brawly in Dewford Gym.", "Explore Granite Cave and deliver the letter to Steven.", "Sail to Slateport and deliver the Devon goods at the museum; resolve the villain battle.", "Head north on Route 110, battle your rival and reach Mauville.", "Defeat Wattson at Mauville Gym; obtain Rock Smash from the local NPC."]}, {"title": "Fallarbor to Petalburg", "steps": ["Travel north via Routes 111 and 112; cross Fiery Path.", "Follow Routes 113 and 114 to Fallarbor and Meteor Falls.", "Resolve the Meteor Falls villain event and return toward Mt. Chimney.", "Take the cable car to Mt. Chimney; defeat the villain leader and resolve the meteorite event.", "Descend Jagged Pass to Lavaridge.", "Defeat Flannery and obtain access to the desert when offered.", "Return to Petalburg and defeat Norman.", "Obtain Surf from Wally’s family."]}, {"title": "Fortree and Lilycove", "steps": ["Cross Route 118 and follow Route 119 toward the Weather Institute.", "Clear the Weather Institute and continue past the rival battle.", "Reach Fortree; follow Route 120 to meet Steven and obtain the Devon Scope.", "Use the scope to open Fortree Gym and defeat Winona.", "Travel Routes 120 and 121 to Lilycove.", "Visit Mt. Pyre via Route 122 and resolve the summit event.", "Follow the villain storyline through Jagged Pass and the Magma Hideout.", "Return to Slateport for the submarine event and then clear the Aqua Hideout near Lilycove."]}, {"title": "Mossdeep to Sootopolis", "steps": ["Surf east via Route 124 to Mossdeep and defeat Tate and Liza.", "Resolve the Space Center event and obtain Dive from Steven.", "Use Dive in the southern ocean and locate Seafloor Cavern.", "Clear Seafloor Cavern and resolve the legendary crisis.", "Reach Sootopolis by underwater entrance and speak with the relevant NPCs.", "Follow the storyline to Sky Pillar via Route 131; return to Sootopolis to resolve the crisis.", "Obtain Waterfall when available and defeat Juan in Sootopolis Gym."]}, {"title": "League and later", "steps": ["Surf toward Ever Grande and use Waterfall to reach the entrance.", "Cross Victory Road and resolve Wally’s battle.", "Defeat the Elite Four and Champion.", "Consult the full guide for optional desert, ocean routes, hidden items, Battle Frontier and other available postgame objectives."]}], "Sinnoh": [{"title": "Twinleaf to Oreburgh", "steps": ["Leave Twinleaf and meet your rival on Route 201; follow the starter event.", "Visit Professor Rowan in Sandgem and receive the Pokédex.", "Return home if required, then follow Route 202 to Jubilife.", "Resolve the trainer school and Pokétch events.", "Follow Route 203, battle your rival and cross Oreburgh Gate.", "Find Roark in Oreburgh Mine and defeat him at the gym."]}, {"title": "Floaroma to Eterna", "steps": ["Return to Jubilife and resolve the Galactic encounter north of town.", "Travel Route 204 through Ravaged Path to Floaroma.", "Obtain the Valley Windworks key from the meadow and defeat Galactic inside the works.", "Travel Route 205 and escort Cheryl through Eterna Forest.", "Reach Eterna and defeat Gardenia.", "Obtain Cut and enter the Galactic building; defeat Jupiter.", "Rescue the bicycle shop owner and collect a bicycle."]}, {"title": "Hearthome to Pastoria", "steps": ["Ride south on Cycling Road and follow Route 207 through Mt. Coronet toward Hearthome.", "Resolve Hearthome’s introductory events and defeat Fantina.", "Travel Route 209 to Solaceon and continue via Routes 210 and 215 to Veilstone.", "Defeat Maylene and help recover the Pokédex from Galactic; obtain Fly when available.", "Head south via Routes 214 and 213 to Pastoria.", "Defeat Crasher Wake; pursue the Galactic grunt toward the lake area.", "Receive the medicine for the Psyduck from Cynthia."]}, {"title": "Celestic and Canalave", "steps": ["Return to Route 210 and clear the Psyduck; follow the foggy northern path.", "Deliver the Old Charm in Celestic and investigate the ruins.", "Resolve the Galactic confrontation and obtain Surf when available.", "Return to Jubilife and travel west on Route 218 to Canalave.", "Battle your rival and defeat Byron at Canalave Gym.", "Visit the library and follow the emergency storyline."]}, {"title": "Lakes and Snowpoint", "steps": ["Investigate Lake Valor and defeat Galactic members.", "Return to Lake Verity and defeat the Galactic commander there.", "Cross Mt. Coronet and Routes 216 and 217 to Snowpoint.", "Obtain Rock Climb on Route 217 if available.", "Defeat Candice in Snowpoint Gym.", "Visit Lake Acuity and resolve the rival and Galactic event."]}, {"title": "Galactic finale and League", "steps": ["Return to Veilstone, obtain access to Galactic’s warehouse and HQ.", "Find the Galactic Key, defeat Cyrus and free the lake Pokémon.", "Climb Mt. Coronet to Spear Pillar and defeat the Galactic commanders.", "Follow the remaining Distortion World / legendary storyline as implemented in PokeMMO.", "Return to the Valor Lakefront area and follow Route 222 to Sunyshore.", "Find Volkner and defeat him at Sunyshore Gym.", "Obtain Waterfall when available and follow Route 223 to the League.", "Cross Victory Road and defeat the Elite Four and Champion.", "Use the linked guide for optional routes, islands, hidden items and postgame access."]}], "Unova": [{"title": "Nuvema to Striaton", "steps": ["Choose your starter in Nuvema and complete the introductory rival battles.", "Meet Professor Juniper and follow Route 1 to Accumula.", "Resolve the Team Plasma speech and N battle.", "Travel Route 2 to Striaton; battle Cheren at the Trainer School.", "Visit the Dreamyard and obtain the gifted elemental monkey if offered.", "Defeat the Striaton Gym leader; obtain Cut and resolve the Dreamyard Plasma event."]}, {"title": "Nacrene and Castelia", "steps": ["Follow Route 3, resolve the stolen Pokémon event in Wellspring Cave and continue to Nacrene.", "Defeat Lenora at Nacrene Gym.", "Pursue Team Plasma into Pinwheel Forest and recover the stolen museum artifact.", "Cross Skyarrow Bridge to Castelia.", "Resolve the Team Plasma incident near the gym and docks.", "Defeat Burgh at Castelia Gym."]}, {"title": "Nimbasa to Driftveil", "steps": ["Travel north through Route 4 toward Nimbasa.", "Resolve the Plasma confrontation at the amusement area and the encounter with N.", "Defeat Elesa in Nimbasa Gym.", "Travel west via Route 5 and cross Driftveil Drawbridge.", "Enter Driftveil and clear Team Plasma from Cold Storage.", "Defeat Clay and obtain the next route’s access."]}, {"title": "Mistralton to Icirrus", "steps": ["Follow Route 6 to Chargestone Cave; resolve the Plasma battles inside.", "Exit to Mistralton and meet Skyla.", "Travel Route 7 and climb Celestial Tower; speak with Skyla at the top.", "Return to Mistralton and defeat Skyla.", "Continue through Route 7 and Twist Mountain to Icirrus.", "Defeat Brycen in Icirrus Gym."]}, {"title": "Dragonspiral and Opelucid", "steps": ["Investigate Dragonspiral Tower and resolve the Plasma storyline.", "Travel back through Desert Resort to Relic Castle and investigate its lower levels.", "Follow the story to Nacrene Museum and obtain the relevant stone if offered.", "Return east via Icirrus, Route 8 and Tubeline Bridge to Route 9 and Opelucid.", "Defeat the Opelucid Gym leader."]}, {"title": "League and Plasma finale", "steps": ["Travel north through Route 10 and the badge gates.", "Cross Victory Road and defeat the Elite Four.", "Follow N’s Castle storyline, including the remaining N and Ghetsis encounters where applicable.", "Return for the Champion battle if required for your completion goal.", "Check the full guide for postgame routes, hidden items and region-specific PokeMMO changes."]}]};
